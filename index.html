<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цифровой сувенир МФМ 2026: Открытка из России</title>
    <meta name="description" content="Интерактивная открытка-сувенир для участников МФМ 2026 от Арины: знакомство с Россией, культурой, играми, новеллами, викторина и обмен книжными рекомендациями." />
    <meta property="og:title" content="Цифровой сувенир МФМ 2026: Открытка из России" />
    <meta property="og:description" content="Интерактивная открытка-сувенир для участников МФМ 2026 от Арины: знакомство с Россией, культурой, играми, новеллами, викторина и обмен книжными рекомендациями." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Ysabeau+Office:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Global error shield for external cross-origin scripts -->
    <script type="text/javascript">
      window.addEventListener('error', function(e) {
        if (!e) return;
        if (e.message === 'Script error.' || !e.message || (e.filename && e.filename.indexOf('translate.google') !== -1)) {
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          if (typeof e.preventDefault === 'function') e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason) {
          var str = String(e.reason && e.reason.message ? e.reason.message : e.reason);
          if (str.indexOf('Script error') !== -1) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
          }
        }
      });
      window.onerror = function(msg, url) {
        if (msg === 'Script error.' || (url && url.indexOf('translate.google') !== -1)) {
          return true;
        }
        return false;
      };
    </script>
  </head>
  <body class="bg-[#faf7f2] text-stone-800 antialiased selection:bg-amber-200 selection:text-stone-900 overflow-x-hidden">
    <div id="google_translate_element" style="display: none;"></div>

    <script type="text/javascript">
      function getInitialAudienceMode() {
        try {
          var params = new URLSearchParams(window.location.search);
          var m = params.get('mode') || params.get('audience');
          if (m === 'citizen' || m === 'rf') return 'citizen';
          if (m === 'international' || m === 'world') return 'international';
          var saved = localStorage.getItem('mfm_audience_mode');
          if (saved) return saved;
        } catch(e) {}
        var isRu = typeof navigator !== 'undefined' && navigator.language && navigator.language.toLowerCase().indexOf('ru') === 0;
        return isRu ? 'citizen' : 'international';
      }

      function ensureTargetCookie(targetLang) {
        if (targetLang === 'ru') {
          var domain = window.location.hostname;
          document.cookie = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
          if (domain) {
            document.cookie = 'googtrans=; path=/; domain=' + domain + '; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
            document.cookie = 'googtrans=; path=/; domain=.' + domain + '; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
          }
          return;
        }
        var targetCookie = '/ru/' + targetLang;
        document.cookie = 'googtrans=' + targetCookie + '; path=/;';
        if (window.location.hostname) {
          document.cookie = 'googtrans=' + targetCookie + '; path=/; domain=' + window.location.hostname + ';';
          document.cookie = 'googtrans=' + targetCookie + '; path=/; domain=.' + window.location.hostname + ';';
        }
      }

      var initialTargetLang = 'ru';
      try {
        var mode = getInitialAudienceMode();
        var isExplicit = localStorage.getItem('mfm_explicit_choice') === 'true';
        var saved = localStorage.getItem('mfm_lang');
        if (isExplicit && saved) {
          initialTargetLang = saved;
        } else {
          initialTargetLang = (mode === 'citizen') ? 'ru' : 'en';
        }
        ensureTargetCookie(initialTargetLang);
      } catch (e) {}

      function triggerTargetLanguage() {
        try {
          var isExplicit = localStorage.getItem('mfm_explicit_choice') === 'true';
          var saved = localStorage.getItem('mfm_lang');
          var mode = getInitialAudienceMode();
          var targetLang = (isExplicit && saved) ? saved : (mode === 'citizen' ? 'ru' : 'en');
          if (targetLang === 'ru') return;

          var attempts = 0;
          var interval = setInterval(function() {
            attempts++;
            var combo = document.querySelector('.goog-te-combo');
            if (combo && combo.options && combo.options.length > 0) {
              combo.value = targetLang;
              if (typeof combo.onchange === 'function') {
                try { combo.onchange(); } catch(e) {}
              }
              combo.dispatchEvent(new Event('change', { bubbles: true }));
              combo.dispatchEvent(new Event('input', { bubbles: true }));
              clearInterval(interval);
            }
            if (attempts > 80) {
              clearInterval(interval);
            }
          }, 50);
        } catch(e) {}
      }

      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'ru',
              autoDisplay: false
            }, 'google_translate_element');
            triggerTargetLanguage();
          }
        } catch(e) {}
      };

      // Load Google Translate script only when language is not Russian
      if (initialTargetLang !== 'ru') {
        var gtScript = document.createElement('script');
        gtScript.type = 'text/javascript';
        gtScript.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        gtScript.async = true;
        gtScript.defer = true;
        gtScript.onerror = function() { /* fail silently */ };
        document.head.appendChild(gtScript);
      }
    </script>

    <!-- Background Musicbox Audio Element -->
    <audio id="bgm-musicbox" loop playsinline preload="auto">
      <source src="/audio/musicbox.mp3" type="audio/mpeg">
      <source src="/audio/musicbox.wav" type="audio/wav">
    </audio>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
