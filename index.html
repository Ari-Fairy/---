<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цифровой сувенир МФМ 2026: Открытка из России</title>
    <meta name="description" content="Интерактивная открытка-сувенир для участников МФМ 2026 от Арины: знакомство с Россией, культурой, играми, новеллами, викторина и обмен книжными рекомендациями." />
    <meta property="og:title" content="Цифровой сувенир МФМ 2026: Открытка из России" />
    <meta property="og:description" content="Интерактивная открытка-сувенир для участников МФМ 2026 от Арины: знакомство с Россией, культурой, играми, новеллами, викторина и обмен книжными рекомендациями." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Ysabeau+Office:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#faf7f2] text-stone-800 antialiased selection:bg-amber-200 selection:text-stone-900 overflow-x-hidden">
    <div id="google_translate_element" style="display: none;"></div>

    <script type="text/javascript">
      // International Youth Festival 2026: Default language is English (en)
      function ensureTargetCookie(targetLang) {
        if (targetLang === 'ru') {
          var domain = window.location.hostname;
          document.cookie = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
          if (domain) {
            document.cookie = 'googtrans=; path=/; domain=' + domain + '; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
            document.cookie = 'googtrans=; path=/; domain=.' + domain + '; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
          }
          return;
        }
        var targetCookie = '/ru/' + targetLang;
        document.cookie = 'googtrans=' + targetCookie + '; path=/;';
        if (window.location.hostname) {
          document.cookie = 'googtrans=' + targetCookie + '; path=/; domain=' + window.location.hostname + ';';
          document.cookie = 'googtrans=' + targetCookie + '; path=/; domain=.' + window.location.hostname + ';';
        }
      }

      var initialTargetLang = 'en';
      try {
        var isExplicit = localStorage.getItem('mfm_explicit_choice') === 'true';
        var saved = localStorage.getItem('mfm_lang');
        if (isExplicit && saved) {
          initialTargetLang = saved;
        } else {
          initialTargetLang = 'en';
          localStorage.setItem('mfm_lang', 'en');
        }
        ensureTargetCookie(initialTargetLang);
      } catch (e) {}

      function triggerTargetLanguage() {
        try {
          var isExplicit = localStorage.getItem('mfm_explicit_choice') === 'true';
          var saved = localStorage.getItem('mfm_lang');
          var targetLang = (isExplicit && saved) ? saved : 'en';
          if (targetLang === 'ru') return;

          var attempts = 0;
          var interval = setInterval(function() {
            attempts++;
            var combo = document.querySelector('.goog-te-combo');
            if (combo && combo.options && combo.options.length > 0) {
              combo.value = targetLang;
              if (typeof combo.onchange === 'function') {
                try { combo.onchange(); } catch(e) {}
              }
              combo.dispatchEvent(new Event('change', { bubbles: true }));
              combo.dispatchEvent(new Event('input', { bubbles: true }));
              clearInterval(interval);
            }
            if (attempts > 100) {
              clearInterval(interval);
            }
          }, 40);
        } catch(e) {}
      }

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'ru',
            autoDisplay: false
          }, 'google_translate_element');
          triggerTargetLanguage();
        }
      }

      document.addEventListener('DOMContentLoaded', triggerTargetLanguage);
      window.addEventListener('load', triggerTargetLanguage);
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <!-- Background Musicbox Audio Element -->
    <audio id="bgm-musicbox" loop playsinline preload="auto">
      <source src="/audio/musicbox.mp3" type="audio/mpeg">
      <source src="/audio/musicbox.wav" type="audio/wav">
    </audio>
    <script type="text/javascript">
      (function() {
        var audio = document.getElementById('bgm-musicbox');
        if (!audio) return;
        audio.volume = 0.35;

        var isUserMuted = false;
        try {
          isUserMuted = localStorage.getItem('mfm_bgm_muted') === 'true';
        } catch (e) {}

        if (!isUserMuted) {
          var p = audio.play();
          if (p !== undefined) {
            p.catch(function() {
              var events = ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'mouseup', 'click', 'keydown', 'scroll', 'wheel'];
              var triggerPlay = function() {
                var muted = false;
                try { muted = localStorage.getItem('mfm_bgm_muted') === 'true'; } catch(e) {}
                if (!muted && audio.paused) {
                  audio.play().then(function() {
                    events.forEach(function(ev) {
                      window.removeEventListener(ev, triggerPlay, true);
                      document.removeEventListener(ev, triggerPlay, true);
                    });
                  }).catch(function() {});
                }
              };

              events.forEach(function(ev) {
                window.addEventListener(ev, triggerPlay, { capture: true, passive: true });
                document.addEventListener(ev, triggerPlay, { capture: true, passive: true });
              });
            });
          }
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
